<svg xmlns="http://www.w3.org/2000/svg">
<!-- Art for the public booking page. The page clones <svg id="art-teacup"> and
     <svg id="art-cat"> into [data-art] slots and copies <style id="art-style"> into the
     document once. The art palette lives here (and only here); outlines and steam use
     the theme tokens so both themes stay in tune. Motion hooks, styled in book.css:
     .steam .s0-.s2, .cat-bob, .tail, .eyes-open/.eyes-closed/.eyes-happy, .zz, .dots, .heart. -->
<style id="art-style">
.art { --cat-fur: #d39659; --cat-belly: #f3e3c6; --cat-ear: #de9f90; --cat-tail: #b27842; --cat-nose: #c46b63;
  --cup: #fcf8f0; --cup-band: #b0573a; --tea: #8f5530; --saucer: #d6c4a3; --steam: var(--rule-strong); --glint: #fffaf3; }
@media (prefers-color-scheme: dark) {
  .art { --cat-fur: #c98d55; --cat-belly: #e3cfad; --cat-ear: #c98c80; --cat-tail: #a36b3b; --cat-nose: #d07c72;
    --cup: #e8ddca; --cup-band: #c86d4c; --tea: #6f4428; --saucer: #6f5b47; --glint: #f4eadb; }
}
.art .v-saucer { color: var(--saucer); } .art .v-cup { color: var(--cup); }
.art .v-cup-b { color: var(--cup-band); } .art .v-tea { color: var(--tea); }
.art .steam rect { fill: var(--steam); }
.art .k { fill: var(--ink); } .art .f { fill: var(--cat-fur); } .art .b { fill: var(--cat-belly); }
.art .e { fill: var(--cat-ear); } .art .t { fill: var(--cat-tail); } .art .n { fill: var(--cat-nose); }
.art .c { fill: var(--cat-ear); opacity: .7; } .art .g { fill: var(--glint); opacity: .85; }
</style>
